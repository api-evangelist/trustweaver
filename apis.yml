name: TrustWeaver
description: >-
  TrustWeaver was a Stockholm-based provider of on-demand e-invoicing and e-signature
  compliance services, giving multinational enterprises legally compliant electronic
  invoicing (VAT/tax compliance, authenticity and integrity via digital signatures)
  across dozens of countries. Backed by Creandum, the company was acquired by Pagero
  in 2018; Pagero was subsequently absorbed into Sovos (2024). The trustweaver.com
  domain now issues a 301 redirect to Sovos's e-invoicing compliance solution, so no
  independent TrustWeaver developer portal, public API, or API documentation remains
  online. This profile is retained as a historical/acquisition lead in the API
  Evangelist network; there is no standalone API surface to enrich.
